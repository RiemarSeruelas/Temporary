<!doctype html><html><head><meta charset='utf-8'><link rel='stylesheet' href='src/App.css'><style>html,body{margin:0;width:100%;height:100%;background:#090e14} body{font-family:Arial,sans-serif}.demo{height:100vh;padding:20px;box-sizing:border-box}.admin-workspace{height:100%;padding:20px;box-sizing:border-box}.operator-admin{height:auto}.operator-registration-layout{grid-template-columns:1fr}.operator-assignments-card{display:none}</style></head><body><div class='demo admin-workspace'><section class='operator-admin'><header class='operator-admin-heading'><div><span>Operator confirmation</span><h1>Registration and logs</h1></div><div class='operator-heading-actions'><button class='operator-download-button'>Download Excel</button><div class='operator-tabs'><button class='active'>Registration</button><button>Logs</button></div></div></header><div style='height:14px'></div><div class='operator-registration-layout'><form class='operator-registration-card'><div class='operator-section-heading'><span>Register shift</span><strong>Operator assignment</strong></div><div class='operator-registration-fields'><label class='operator-name-field'><span>Operator name</span><input></label><label><span>Machine</span><select><option>Mespack</option></select></label><label><span>Shift</span><select><option>1st shift · 6 AM - 2 PM</option></select></label><label class='operator-registration-pin'><span>6-digit PIN</span><input class='pin-input' placeholder='••••••'></label></div><div class='operator-registration-actions'><button class='primary'>Register operator</button></div></form></div></section></div></body></html>
